<div class="card expandable-card">
    <button
        type="button"
        class="expandable-card__header"
        (click)="toggle()">
        <span>
            {{ title }}
        </span>

        <span
            class="expandable-card__icon"
            [class.expanded]="expanded">
            ▶
        </span>
    </button>

    @if (expanded) {

    <div
        class="expandable-card__content">

        <ng-content>
        </ng-content>

    </div>
    }
</div>
