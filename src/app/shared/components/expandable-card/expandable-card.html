<div class="card expandable-card">
    <button
        type="button"
        class="expandable-card__header"
        [disabled]="!collapsible"
        [attr.aria-expanded]="expanded"
        (click)="toggle()">
        <span>

            @if (icon) {

            {{ icon }}

            }

            {{ title }}

        </span>

        <span
            aria-hidden="true"
            class="expandable-card__icon"
            [class.expanded]="expanded">
            ▶
        </span>
    </button>

    @if (expanded) {

    <div class="expandable-card__content">

        <ng-content>
        </ng-content>

    </div>
    }
</div>
