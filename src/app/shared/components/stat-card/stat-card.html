<div
    class="stat-card"
    [class.primary]="variant === 'primary'"
    [class.success]="variant === 'success'"
    [class.warning]="variant === 'warning'"
    [class.danger]="variant === 'danger'"
    [class.info]="variant === 'info'"
    [class.stat-card--active]="active"
    role="status">

    <h3>
        
        {{ title }}

    </h3>

    <strong>

        {{ value }}

    </strong>

    @if (subtitle) {

    <p>

        {{ subtitle }}

    </p>
    
    }
</div>
