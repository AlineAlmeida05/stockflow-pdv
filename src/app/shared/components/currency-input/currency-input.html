<div class="currency-input">
    @if (label) {
    <label>
        {{ label }}
    </label>
    }
    <div class="currency-input__wrapper">
        <span>
            R$
        </span>
        <input
            type="text"
            [value]="displayValue"
            (input)="onInput($event)"
            [placeholder]="placeholder">
    </div>
</div>
