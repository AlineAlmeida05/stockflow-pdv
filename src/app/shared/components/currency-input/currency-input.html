<div class="currency-input">

    @if (label) {

    <label [for]="inputId">

        {{ label }}

    </label>

    }
    <div class="currency-input__wrapper">

        <span aria-hidden="true">
            R$
        </span>

        <input
            [id]="inputId"
            type="text"
            [value]="displayValue"
            (input)="onInput($event)"
            [placeholder]="placeholder">
    </div>
</div>
