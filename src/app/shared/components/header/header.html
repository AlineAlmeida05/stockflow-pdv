<header class="header">

  <button
    type="button"
    class="menu-toggle"
    (click)="alternarMenu()">
    ☰
  </button>

  <div
    class="header-company">

    <img
      [src]="tenantAtual?.logoUrl || branding.logo"
      [alt]="tenantAtual?.nome || branding.nomeExibicao">
    <div>

      <h2>
        {{ ehSuperAdmin ? tenantAtual?.nome || branding.nomeExibicao :
        branding.nomeExibicao }}
      </h2>

      <p>
        {{ branding.slogan }}
      </p>

    </div>
  </div>

  <div class="header-actions">

    <div
      class="profile-menu"
      #profileMenu>

      <button
        class="btn btn-secondary profile-button"
        (click)="alternarMenuPerfil()"
        [attr.aria-expanded]="menuPerfilAberto"
        aria-haspopup="true">

        <div class="profile-button__content">

          <span class="profile-button__name">
            👤 {{ primeiroNome }}
          </span>

          <span class="profile-button__role">
            Perfil: {{ usuarioLogado?.perfil }}
          </span>

        </div>

        <span class="profile-button__arrow">
          {{ menuPerfilAberto ? '▲' : '▼' }}
        </span>
      </button>

      @if (menuPerfilAberto) {
      <div
        class="profile-dropdown"
        role="menu">

        <div class="profile-dropdown__info">

          <small>
            Email: {{ usuarioLogado?.email }}
          </small>

        </div>

        <hr>

        <button
          class="profile-dropdown__action"
          (click)="abrirModalAlterarSenha()">
          Alterar Senha
        </button>

        <button
          class="profile-dropdown__logout"
          (click)="sair()">
          Sair
        </button>

      </div>
      }
    </div>
  </div>
</header>

@if (modalAlterarSenhaAberto) {

<app-alterar-senha-modal
  (fechar)="fecharModalAlterarSenha()">
</app-alterar-senha-modal>

}
