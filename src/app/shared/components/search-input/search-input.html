<div class="search-input">
    <span
        class="search-icon"
        aria-hidden="true">
        🔍
    </span>
    <input
        #searchInput
        type="text"
        [placeholder]="placeholder"
        [attr.aria-label]="placeholder"
        [ngModel]="value"
        [readonly]="readonly"
        [autofocus]="autofocus"
        (ngModelChange)="valueChange.emit($event)">

    @if (value) {

    <button
        type="button"
        class="clear-button"
        aria-label="Limpar busca"
        (click)="limpar()">
        ✕
    </button>
    }
</div>
