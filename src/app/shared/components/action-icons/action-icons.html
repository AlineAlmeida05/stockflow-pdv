@if (showEdit) {
<button
    class="action-btn edit-btn"
    type="button"
    aria-label="Editar"
    title="Editar"
    (click)="edit.emit()">
    ✏️
</button>
}

<button
    class="action-btn delete-btn"
    type="button"
    aria-label="{{ deleteLabel }}"
    title="{{ deleteLabel }}"
    (click)="delete.emit()">

    {{ deleteIcon }}

</button>
