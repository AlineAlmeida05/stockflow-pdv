<div
    class="split-panel"
    [class.reverse]="reverse"
    [class.has-right]="showRight">

    <div class="left">

        <ng-content select="[left]">

        </ng-content>

    </div>

    @if (showRight) {

    <div class="right">

        <ng-content select="[right]">

        </ng-content>

    </div>

    }

</div>
