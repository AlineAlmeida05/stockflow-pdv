<div
    class="split-panel"
    [class.reverse]="reverse"
    [class.mobile-reverse]="reverseMobile"
    [class.has-right]="showRight"
    [class.invert-sizes]="invertSizes"
    [class.disable-invert-mobile]="disableInvertSizesMobile">

    <div class="left">

        <ng-content select="[left]">

        </ng-content>

    </div>

    @if (showRight) {

    <div class="right">

        <ng-content select="[right]">

        </ng-content>

    </div>

    }

</div>
