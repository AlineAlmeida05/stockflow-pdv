<div class="field">

    <label [for]="inputId">
        Produto
    </label>

    <input
        [id]="inputId"
        #produtoInput
        type="text"
        placeholder="Código, código de barras ou nome"
        [(ngModel)]="textoBusca"
        (input)="buscar()"
        (blur)="fecharResultados()"
        (keyup.enter)="selecionarPrimeiroResultado()">

    @if (
    mostrarResultados &&
    resultados.length > 0
    ) {

    <div
        class="resultados"
        role="listbox">

        @for (
        produto of resultados;
        track produto.id
        ) {

        <button
            role="option"
            type="button"
            (click)="selecionarProduto(produto)">

            <strong>
                {{ produto.nome }}
            </strong>

            <small>
                {{ produto.codigo }}
                •
                <span class="estoque-info">
                    Estoque: {{ produto.estoqueAtual }}
                </span>
            </small>

        </button>

        }

    </div>

    }

</div>
