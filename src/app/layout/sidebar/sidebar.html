<nav class="sidebar-nav">

  @for (
  item of menuFiltrado;
  track item.route
  ){
  <a
    [routerLink]="item.route"
    routerLinkActive="sidebar-link--active"
    [routerLinkActiveOptions]="{ exact: true }"
    class="sidebar-link"
    (click)="fecharMenu()">
    {{ item.label }}

    @if (
    obterBadge(item.modulo) > 0
    ) {

    <span class="menu-badge">
      ⚠ {{ obterBadge(item.modulo) }}
    </span>

    }
  </a>
  }
</nav>
