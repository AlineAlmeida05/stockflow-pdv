<nav class="sidebar-nav">

  @for (
  item of menuFiltrado;
  track item.route
  ){
  <a
    [routerLink]="item.route"
    routerLinkActive="sidebar-link--active"
    [routerLinkActiveOptions]="{ exact: true }"
    class="sidebar-link"
    (click)="fecharMenu()">

    <span class="sidebar-link__label">
      {{ item.label }}
    </span>

    @if (
    obterBadge(item.modulo) > 0
    ) {

    <div class="menu-indicator">

      <span
        class="menu-badge"
        aria-label="Pendências">
        {{ obterBadge(item.modulo) }}
      </span>

      <span
        class="menu-alert-icon"
        aria-hidden="true">
        ⚠️
      </span>

    </div>

    }

  </a>
  }
</nav>
