<div class="company-brand-card">
    <h2>
        Identidade Visual
    </h2>

    <p class="brand-description">
        Tema visual ativo do sistema.
    </p>

    <div class="brand-summary">
        <span>
            🎨 Identidade ativa
        </span>
    </div>

    <div class="brand-preview">
        <div
            class="brand-preview__primary"
            [style.background]="tenantAtual?.corPrimaria">

            <small>Cor Primária</small>

            <strong>
                {{ tenantAtual?.corPrimaria }}
            </strong>
        </div>

        <div
            class="brand-preview__secondary"
            [style.background]="tenantAtual?.corSecundaria">

            <small>Cor Secundária</small>

            <strong>
                {{ tenantAtual?.corSecundaria }}
            </strong>
        </div>
    </div>
</div>
