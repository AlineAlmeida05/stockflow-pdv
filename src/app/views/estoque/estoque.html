<app-main-layout>
    <app-page-title
        title="Estoque"
        subtitle="Acompanhe os níveis de estoque e identifique produtos com baixo saldo.">
    </app-page-title>

    <app-toolbar>
        <div class="toolbar-field">
            <app-search-input
                placeholder="Buscar produto..."
                [(value)]="textoBusca">
            </app-search-input>
        </div>

        <div class="toolbar-field">
            <app-select-input
                placeholder="Todos os níveis"
                [(value)]="filtroStatus"
                [options]="statusOptions">
            </app-select-input>
        </div>
    </app-toolbar>

    <div class="estoque-resumo">

        <div
            class="estoque-card"
            [class.estoque-card--active]="filtroStatus === ''"
            (click)="selecionarFiltro('')">

            <app-stat-card
                title="Produtos"
                [value]="totalProdutos"
                variant="info">
            </app-stat-card>
        </div>

        <div
            class="estoque-card"
            [class.estoque-card--active]="filtroStatus === 'normal'"
            (click)="selecionarFiltro('normal')">

            <app-stat-card
                title="Normal"
                [value]="totalEmEstoque"
                variant="success">
            </app-stat-card>

        </div>

        <div
            class="estoque-card"
            [class.estoque-card--active]="filtroStatus === 'atencao'"
            (click)="selecionarFiltro('atencao')">

            <app-stat-card
                title="Atenção"
                [value]="totalAtencao"
                variant="warning">
            </app-stat-card>

        </div>

        <div
            class="estoque-card"
            [class.estoque-card--active]="filtroStatus === 'baixo'"
            (click)="selecionarFiltro('baixo')">
            <app-stat-card
                title="Crítico"
                [value]="totalBaixo"
                variant="danger">
            </app-stat-card>
        </div>
    </div>

    @if (
    produtosFiltrados.length === 0
    ) {

    <app-empty-state
        icon="📦"
        title="Nenhum produto encontrado"
        message="Verifique os filtros aplicados ou cadastre novos produtos.">
    </app-empty-state>
    }

    @if (
    produtosFiltrados.length > 0
    ) {
    <div class="card">
        <app-data-table
            [columns]="colunasEstoque"
            [data]="produtosEstoque">
        </app-data-table>
    </div>
    }
</app-main-layout>
