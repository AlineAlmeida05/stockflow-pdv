<app-main-layout>
    <app-page-title
        title="Produtos"
        subtitle="Cadastre e mantenha os produtos disponíveis para venda.">
    </app-page-title>

    <app-toolbar>
        <button
            type="button"
            class="btn btn-primary"
            (click)="novoProduto()"
            [disabled]="salvandoProduto">
            + Novo Produto
        </button>

        <app-search-input
            placeholder="Buscar produto..."
            [(value)]="textoBusca">
        </app-search-input>
    </app-toolbar>

    @if (mostrarFormulario) {

    <div class="card produto-form-card">
        <h3>
            {{
            !produtoEditandoId
            ? 'Novo Produto'
            : modoVisualizacao
            ? 'Produto'
            : 'Editar Produto'
            }}
        </h3>
        <div class="formulario">
            <div class="field field-large">
                <label>Nome do Produto</label>
                <input
                    type="text"
                    placeholder="Nome"
                    [(ngModel)]="nome"
                    [readonly]="modoVisualizacao">
            </div>

            <div class="field field-large">
                <label>Categoria</label>
                <input
                    type="text"
                    placeholder="Categoria"
                    [(ngModel)]="categoria"
                    [readonly]="modoVisualizacao">
            </div>
            <div class="field field-small">
                <label>Código do Produto</label>
                <input
                    type="text"
                    [value]="codigo"
                    readonly>
            </div>

            <div class="field field-large">
                <label>Código de Barras</label>
                <input
                    type="text"
                    placeholder="Código de Barras"
                    [(ngModel)]="codigoBarras"
                    [readonly]="modoVisualizacao">
            </div>

            <div class="field field-small">
                <label>Estoque Mínimo</label>
                <input
                    type="number"
                    [(ngModel)]="estoqueMinimo"
                    [readonly]="modoVisualizacao">
            </div>

            <div class="field field-small">
                <label>Preço de Venda</label>
                @if (modoVisualizacao) {

                <input
                    type="text"
                    [value]="formatarMoeda(precoVenda)"
                    readonly>

                } @else {

                <input
                    type="number"
                    [(ngModel)]="precoVenda">

                }
            </div>

            <div class="field field-small">
                <label>Estoque Atual</label>

                <input
                    type="number"
                    [value]="estoqueAtual"
                    readonly>
            </div>

            <div class="field field-small">
                <label>Status</label>

                <input
                    type="text"
                    [value]="produtoAtivo ? 'Ativo' : 'Inativo'"
                    readonly>
            </div>
        </div>

        <div class="form-actions">

            @if (modoVisualizacao) {
            <button
                type="button"
                class="btn btn-primary"
                (click)="habilitarEdicao()">
                Editar
            </button>
            <button
                type="button"
                class="btn btn-secondary"
                (click)="cancelarEdicao()">
                Fechar
            </button>
            } @else {
            <button
                type="button"
                class="btn btn-primary"
                (click)="salvarProduto()"
                [disabled]="salvandoProduto">
                {{
                salvandoProduto
                ? 'Salvando...'
                : produtoEditandoId
                ? 'Atualizar Produto'
                : 'Salvar Produto'
                }}
            </button>

            <button
                type="button"
                class="btn btn-secondary"
                (click)="cancelarEdicao()">
                Cancelar
            </button>
            }
        </div>
    </div>
    }

    <div class="card produtos-resumo">
        <span>
            📦
        </span>

        <strong>
            Total de produtos:
        </strong>
        {{ produtosFiltrados.length }}
    </div>

    @if (
    produtosFiltrados.length === 0
    ) {
    <app-empty-state
        message="Nenhum produto cadastrado.">
    </app-empty-state>
    }
    <div class="card">
        <app-data-table
            [columns]="colunasProdutos"
            [data]="produtosTabela"
            [showActions]="true"
            [showEditAction]="false"
            actionsHeader="Controle"
            [clickableRows]="true"
            (rowClick)="visualizarProduto($event)"
            (delete)="excluirProdutoTabela($event)">
        </app-data-table>
    </div>
</app-main-layout>
