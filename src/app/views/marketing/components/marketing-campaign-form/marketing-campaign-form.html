<div class="marketing-card">
    <h3>
        Criar Arte de Divulgação
    </h3>

    <div class="marketing-form">
        <!-- Produto em Promoção -->
        <label>
            Produto em Promoção
            <select
                [(ngModel)]="promocaoSelecionada">
                <option value>
                    Selecione
                </option>

                @for (
                promocao of promocoesAtivas;
                track promocao.id
                ) {

                <option
                    [value]="promocao.id">
                    {{ promocao.nome }}
                    -
                    R$
                    {{ promocao.precoPromocional }}
                </option>
                }
                @if (
                promocoesAtivas.length === 0
                ) {
                <div
                    class="marketing-empty">
                    Nenhuma promoção ativa encontrada.
                </div>
                }
            </select>
        </label>

        <!-- Modo da IA -->
        <label>
            Modo da IA
            <select
                [(ngModel)]="modoIaSelecionado">
                <option>
                    Automático
                </option>

                <option>
                    Manual
                </option>
            </select>
        </label>

        @if (modoIaSelecionado === 'Manual') {
        <h3>
            Direção Criativa
        </h3>
        
            <!-- Tom -->
        <label>
            Tom
            <select
                [(ngModel)]="tomSelecionado">
                <option>
                    Promocional
                </option>

                <option>
                    Divertido
                </option>

                <option>
                    Urgente
                </option>

                <option>
                    Premium
                </option>
            </select>
        </label>

        <!-- Tipo da Promoção -->
        <label>
            Tipo da Promoção
            <select
                [(ngModel)]="tipoPromocaoSelecionado">

                <option>
                    Mega Promoção
                </option>

                <option>
                    Oferta Relâmpago
                </option>

                <option>
                    Combo Especial
                </option>

                <option>
                    Mais Vendido
                </option>

                <option>
                    Lançamento
                </option>

            </select>

        </label> 

        <!-- Elemento Visual Principal -->
        <label>
            Elemento Visual Principal
            <select
                [(ngModel)]="elementoVisualSelecionado">

                <option>
                    Automático
                </option>

                <option>
                    Gelo
                </option>

                <option>
                    Fumaça
                </option>

                <option>
                    Neon
                </option>

                <option>
                    Luxo
                </option>

                <option>
                    Madeira
                </option>

                <option>
                    Churrasco
                </option>

                <option>
                    Balada
                </option>

            </select>

        </label>
        }

        <h3>
            Informações Adicionais
        </h3>

        <!-- Observações -->
        <label>
            Observações
            <textarea
                rows="4"
                [(ngModel)]="observacoes"
                placeholder="Ex.: destacar que a promoção termina no domingo.">
            </textarea>
        </label>
        
        <!-- Criar Arte -->
        <button
            type="button"
            (click)="gerarCampanha()">
            ✨ Criar Arte
        </button>
    </div>
</div>
