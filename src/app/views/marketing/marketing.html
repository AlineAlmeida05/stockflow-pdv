<app-main-layout>

    <app-page-title
        title="Marketing da Promoção"
        subtitle="Crie materiais de divulgação para a promoção selecionada">

    </app-page-title>

    <button
        class="btn-link btn btn-primary"
        type="button"
        (click)="voltarParaPromocoes()">

        ← Voltar para Promoções

    </button>

    <div class="marketing-page">

        <app-split-panel
            [showRight]="true"
            [invertSizes]="true">

            <div left>

                <div class="marketing-card">

                    <h3>

                        Criar Arte de Divulgação

                    </h3>

                    <div class="marketing-form">

                        <label>

                            <div class="produto-selecionado">

                                <h3>

                                    Produto Selecionado

                                </h3>

                                <strong>

                                    ✅ {{ obterPromocaoSelecionada()?.nome }}

                                </strong>

                            </div>

                        </label>

                        <label>

                            Observações

                            <textarea
                                rows="4"
                                [(ngModel)]="observacoes">

                            </textarea>

                        </label>

                        <h3>

                            Direção Criativa

                        </h3>

                        <label>

                            Tom

                            <select
                                [(ngModel)]="tomSelecionado">

                                <option>

                                    Promocional

                                </option>

                                <option>

                                    Divertido

                                </option>

                                <option>

                                    Urgente

                                </option>

                                <option>

                                    Premium

                                </option>

                            </select>

                        </label>

                        <label>

                            Tipo da Promoção

                            <select
                                [(ngModel)]="tipoPromocaoSelecionado">

                                <option>

                                    Mega Promoção

                                </option>

                                <option>

                                    Oferta Relâmpago

                                </option>

                                <option>

                                    Combo Especial

                                </option>

                                <option>

                                    Mais Vendido

                                </option>

                                <option>

                                    Lançamento

                                </option>

                            </select>

                        </label>

                        <label>

                            Elemento Visual Principal

                            <select
                                [(ngModel)]="elementoVisualSelecionado">

                                <option>

                                    Automático

                                </option>

                                <option>

                                    Gelo

                                </option>

                                <option>

                                    Fumaça

                                </option>

                                <option>

                                    Neon

                                </option>

                                <option>

                                    Luxo

                                </option>

                                <option>

                                    Madeira

                                </option>

                                <option>

                                    Churrasco

                                </option>

                                <option>

                                    Balada

                                </option>

                            </select>

                        </label>

                        <button
                            type="button"
                            (click)="gerarCampanha()"
                            [disabled]="gerandoCampanha">

                            {{ gerandoCampanha? 'Gerando...': '✨ Criar Prompt'
                            }}

                        </button>

                    </div>

                </div>

            </div>

            <div right>

                <div class="marketing-card">

                    @if (campanhaAtual) {

                    <div class="prompt-header">

                        <h3>

                            🎨 Prompt

                        </h3>

                        <button
                            type="button"
                            class="copy-button"
                            (click)="copiarPrompt()">

                            📋 Copiar

                        </button>

                    </div>

                    <div class="prompt-container">

                        <pre>

                            {{ campanhaAtual.prompt }}

                        </pre>

                    </div>

                    <div class="marketing-ai-tools">

                        <h3>
                            🚀 Gerar Arte com IA
                        </h3>

                        <p>

                            Copie o prompt acima e utilize a plataforma de sua
                            preferência para criar a arte promocional.

                        </p>

                        <div class="marketing-ai-links">

                            <a
                                href="https://chatgpt.com"
                                target="_blank">

                                <span>

                                    🤖

                                </span>

                                <strong>

                                    ChatGPT

                                </strong>

                            </a>

                            <a
                                href="https://copilot.microsoft.com"
                                target="_blank">

                                <span>

                                    🧠
                                </span>

                                <strong>

                                    Copilot

                                </strong>

                            </a>

                            <a
                                href="https://gemini.google.com"
                                target="_blank">

                                <span>

                                    ✨

                                </span>

                                <strong>

                                    Gemini

                                </strong>

                            </a>

                        </div>

                    </div>

                    } @else {

                    <app-empty-state
                        icon="🤖"
                        title="Selecione uma promoção e clique em"
                        message="✨ Criar Prompt para gerar um material de divulgação">

                    </app-empty-state>

                    }

                </div>

            </div>

        </app-split-panel>

    </div>

</app-main-layout>
