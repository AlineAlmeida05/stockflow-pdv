<form
    [formGroup]="form"
    (ngSubmit)="submit()">

    <div>
        <label for="email">
            E-mail
        </label>

        <input
            id="email"
            type="email"
            formControlName="email">
    </div>

    <div>
        <label for="senha">
            Senha
        </label>

        <input
            id="senha"
            type="password"
            formControlName="senha">
    </div>

    <button type="submit">
        Entrar
    </button>

</form>
