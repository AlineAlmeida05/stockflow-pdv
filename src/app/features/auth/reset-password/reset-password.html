<div class="login-page">

    <div class="card login-card">

        <div class="card-header">

            <h1>
                Redefinir Senha
            </h1>

        </div>

        <div class="card-body">       

            <p *ngIf="validandoToken">
                Validando token...
            </p>

            <p
                *ngIf="!validandoToken && !tokenValido"
                class="erro-token">
                Este link é inválido ou expirou.
            </p>

            <form
                *ngIf="!validandoToken && tokenValido"
                [formGroup]="form"
                (ngSubmit)="submit()">

                <div class="field">

                    <label>
                        Nova Senha
                    </label>

                    <input
                        type="password"
                        formControlName="novaSenha">

                </div>

                <div class="field">

                    <label>
                        Confirmar Senha
                    </label>

                    <input
                        type="password"
                        formControlName="confirmarSenha">

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                    [disabled]="loading">

                    @if (loading) {

                    Alterando...

                    } @else {

                    Redefinir Senha

                    }

                </button>

            </form>           

        </div>

    </div>

</div>
